<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>رفع نسخة التطبيق</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:#0f0f12; color:#eee; font-family:system-ui, sans-serif; }
  .card { background:#1a1a20; padding:28px; border-radius:16px; width:min(92vw, 420px); }
  h1 { font-size:20px; margin:0 0 6px; }
  p.sub { color:#999; font-size:13px; margin:0 0 18px; }
  input { width:100%; box-sizing:border-box; margin:6px 0; padding:12px 14px; border-radius:10px;
          border:1px solid #333; background:#111; color:#eee; font-size:14px; }
  button { width:100%; margin-top:14px; padding:13px; border:0; border-radius:10px;
           background:#D4AF37; color:#111; font-weight:700; font-size:15px; cursor:pointer; }
  #msg { margin-top:14px; font-size:13px; min-height:18px; word-break:break-all; }
  .hidden { display:none; }
</style>
</head>
<body>
<div class="card">
  <h1>📲 رفع نسخة تطبيق العملاء</h1>
  <p class="sub">ارفع ملف الـ APK مرة واحدة، وهيظهر زرار «حمّل تطبيقنا» في صفحة المنيو تلقائياً.</p>

  <div id="loginBox">
    <input id="email" type="email" placeholder="البريد الإلكتروني">
    <input id="pass" type="password" placeholder="كلمة المرور">
    <button onclick="login()">تسجيل الدخول</button>
  </div>

  <div id="uploadBox" class="hidden">
    <input id="version" type="text" placeholder="رقم النسخة (اختياري) مثال: 1.0">
    <input id="apk" type="file" accept=".apk">
    <button onclick="upload()">رفع النسخة</button>
    <button onclick="provision()" style="background:#333;color:#eee">تفعيل الإشعارات للتطبيق</button>
  </div>

  <div id="msg"></div>
</div>
<script>
let token = localStorage.getItem("appUploadToken") || "";
if (token) showUpload();
function showUpload() {
  document.getElementById("loginBox").classList.add("hidden");
  document.getElementById("uploadBox").classList.remove("hidden");
}
function msg(t, ok) {
  const m = document.getElementById("msg");
  m.style.color = ok ? "#81C784" : "#E57373";
  m.textContent = t;
}
async function login() {
  msg("...");
  try {
    const r = await fetch("/api/v1/users/login", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email: email.value.trim(), password: pass.value })
    });
    const j = await r.json();
    if (!r.ok) throw new Error(j.message || "فشل تسجيل الدخول");
    token = j.token;
    localStorage.setItem("appUploadToken", token);
    showUpload();
    msg("تم تسجيل الدخول ✅", true);
  } catch (e) { msg(e.message); }
}
async function provision() {
  msg("بيتم تجهيز الإشعارات...");
  try {
    const r = await fetch("/api/v1/app/firebase", {
      method: "POST", headers: { Authorization: "Bearer " + token }
    });
    const j = await r.json();
    if (!r.ok) throw new Error(j.message || "فشل التفعيل");
    msg("الإشعارات مفعّلة ✅ " + j.data.packageName, true);
  } catch (e) { msg(e.message); }
}
async function upload() {
  const f = document.getElementById("apk").files[0];
  if (!f) return msg("اختار ملف الـ APK الأول");
  msg("بيترفع... ممكن ياخد دقيقة");
  try {
    const fd = new FormData();
    fd.append("apk", f);
    fd.append("version", document.getElementById("version").value.trim());
    const r = await fetch("/api/v1/app/upload", {
      method: "POST", headers: { Authorization: "Bearer " + token }, body: fd
    });
    const j = await r.json();
    if (!r.ok) throw new Error(j.message || "فشل الرفع");
    msg("اترفعت ✅ الرابط: " + j.data.url, true);
  } catch (e) { msg(e.message); }
}
</script>
</body>
</html>
